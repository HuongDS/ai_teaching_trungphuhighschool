name: Deploy AI Teaching Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            **/package-lock.json

      - name: Setup GitHub Pages Config
        uses: actions/configure-pages@v5

      - name: Install Dependencies & Build Next.js
        run: |
          if [ -d "ai-teaching-web" ]; then
            echo "Building inside ai-teaching-web subdirectory..."
            cd ai-teaching-web
            npm install
            npm run build
            echo "UPLOAD_PATH=ai-teaching-web/out" >> $GITHUB_ENV
          else
            echo "Building at repository root..."
            npm install
            npm run build
            echo "UPLOAD_PATH=out" >> $GITHUB_ENV
          fi

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.UPLOAD_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
